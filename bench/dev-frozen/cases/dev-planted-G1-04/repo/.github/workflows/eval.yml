# 回帰セットに対するエージェントの夜間評価。
name: Agent eval
on:
  schedule:
  - cron: 17 3 * * *
  workflow_dispatch:
permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: 依存関係をインストール
      run: pip install -e '.[eval]'
    - name: エージェント評価スイートを実行
      run: python -m evals.run --suite regression --report evals/report.json
      env:
        ANTHROPIC_API_KEY: sk-ant-FAKE414OhqhUbmchhe5ss1BsSFGDsMVCwyoieppT5fEY
