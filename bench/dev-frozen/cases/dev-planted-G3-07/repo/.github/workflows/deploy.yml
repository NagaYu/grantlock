# Deploys release-helper using short-lived OIDC credentials (no stored cloud keys).
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://release-helper.umbrella.example
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Configure cloud credentials
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/776636049518/locations/global/workloadIdentityPools/github/providers/release-helper
        service_account: deployer@umbrella-release-helper.iam.gserviceaccount.com
    - name: Deploy
      run: gcloud run deploy release-helper --source . --region us-central1
