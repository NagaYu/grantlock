# qa-pilot を OIDC の短期認証でデプロイする（クラウドの鍵は保存しない）。
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: クラウド認証情報を設定
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: デプロイ
      run: az webapp up --name qa-pilot
