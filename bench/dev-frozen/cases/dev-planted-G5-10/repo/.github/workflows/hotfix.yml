# Manual hotfix deploy
name: Hotfix
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: クラウド認証情報を設定
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::284170984702:role/repo-gardener-deploy
        aws-region: ap-northeast-1
    - name: デプロイ
      run: aws ecs update-service --cluster repo-gardener --service api --force-new-deployment
