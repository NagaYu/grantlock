# Continuous integration for onboarding-buddy.
# Keep permissions minimal; see SECURITY.md.
name: CI
on:
  push:
    branches:
    - main
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -e '.[test]'
    - name: Run unit tests
      run: pytest -q --cov=src --cov-report=xml
    - name: notify
      if: ${{ failure() }}
      run: |
        curl -sS -X POST -H "Authorization: Bearer xoxb-FAKE-978366500817-otRPtbZHYlSoURr6rw03adl9" \
          -d "channel=C0ALERTS&text=CI failed" https://slack.com/api/chat.postMessage
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Lint
      run: pipx run ruff check .
    permissions: {}
