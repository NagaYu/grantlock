# Deploys triage-agent using short-lived OIDC credentials (no stored cloud keys).
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://triage-agent.globex.example
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Configure cloud credentials
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/261173996211/locations/global/workloadIdentityPools/github/providers/triage-agent
        service_account: deployer@globex-triage-agent.iam.gserviceaccount.com
    - name: Deploy
      run: gcloud run deploy triage-agent --source . --region us-central1
