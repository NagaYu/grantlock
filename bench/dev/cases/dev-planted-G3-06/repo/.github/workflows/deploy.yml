# research-scout を OIDC の短期認証でデプロイする（クラウドの鍵は保存しない）。
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://research-scout.umbrella.example
    permissions:
      contents: read
      id-token: write
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: クラウド認証情報を設定
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/365189811832/locations/global/workloadIdentityPools/github/providers/research-scout
        service_account: gha-admin@umbrella-research-scout.iam.gserviceaccount.com
    - name: デプロイ
      run: gcloud run deploy research-scout --source . --region us-central1
