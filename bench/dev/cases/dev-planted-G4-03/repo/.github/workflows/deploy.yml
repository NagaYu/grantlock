# Deploys qa-pilot using short-lived OIDC credentials (no stored cloud keys).
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://qa-pilot.initech.example
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Configure cloud credentials
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/152065560163/locations/global/workloadIdentityPools/github/providers/qa-pilot
        service_account: deployer@initech-qa-pilot.iam.gserviceaccount.com
    - name: Deploy
      run: gcloud run deploy qa-pilot --source . --region us-central1
