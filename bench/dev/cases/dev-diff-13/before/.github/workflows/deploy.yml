# Deploys onboarding-buddy using short-lived OIDC credentials (no stored cloud keys).
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://onboarding-buddy.umbrella.example
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Configure cloud credentials
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/552876384398/locations/global/workloadIdentityPools/github/providers/onboarding-buddy
        service_account: deployer@umbrella-onboarding-buddy.iam.gserviceaccount.com
    - name: Deploy
      run: gcloud run deploy onboarding-buddy --source . --region us-central1
