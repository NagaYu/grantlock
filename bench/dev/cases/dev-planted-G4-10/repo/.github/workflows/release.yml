# Trusted Publishing でリリースを公開する。
name: Release
on:
  release:
    types:
    - published
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: 依存関係をインストール
      run: python -m pip install build && python -m build
    - name: パッケージを公開
      uses: pypa/gh-action-pypi-publish@release/v1
