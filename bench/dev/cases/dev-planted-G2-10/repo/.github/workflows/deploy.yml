# triage-agent を OIDC の短期認証でデプロイする（クラウドの鍵は保存しない）。
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://triage-agent.stark-labs.example
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: クラウド認証情報を設定
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/852671663510/locations/global/workloadIdentityPools/github/providers/triage-agent
        service_account: deployer@stark-labs-triage-agent.iam.gserviceaccount.com
    - name: デプロイ
      run: gcloud run deploy triage-agent --source . --region us-central1
