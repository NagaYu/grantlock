# Deploys onboarding-buddy using short-lived OIDC credentials (no stored cloud keys).
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Configure cloud credentials
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Deploy
      run: az webapp up --name onboarding-buddy
