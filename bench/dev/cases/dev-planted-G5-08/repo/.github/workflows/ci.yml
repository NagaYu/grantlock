# qa-pilot の CI。
# 権限は最小限にすること（SECURITY.md 参照）。
name: CI
on:
  push:
    branches:
    - main
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: Python をセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 依存関係をインストール
      run: pip install -e '.[test]'
    - name: ユニットテストを実行
      run: pytest -q --cov=src --cov-report=xml
    - name: agent smoke test
      run: python -m evals.run --suite smoke
      env:
        ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: 静的解析
      run: pipx run ruff check .
    permissions: {}
