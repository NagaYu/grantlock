# qa-pilot を OIDC の短期認証でデプロイする（クラウドの鍵は保存しない）。
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://qa-pilot.umbrella.example
    permissions:
      contents: read
      id-token: write
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: クラウド認証情報を設定
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/108709681398/locations/global/workloadIdentityPools/github/providers/qa-pilot
        service_account: deployer@umbrella-qa-pilot.iam.gserviceaccount.com
    - name: デプロイ
      run: gcloud run deploy qa-pilot --source . --region us-central1
      env:
        DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
