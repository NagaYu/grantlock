# support-copilot を OIDC の短期認証でデプロイする（クラウドの鍵は保存しない）。
name: Deploy
on:
  push:
    branches:
    - main
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://support-copilot.initech.example
    permissions:
      contents: read
      id-token: write
    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
    - name: クラウド認証情報を設定
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/369017534772/locations/global/workloadIdentityPools/github/providers/support-copilot
        service_account: deployer@initech-support-copilot.iam.gserviceaccount.com
    - name: デプロイ
      run: gcloud run deploy support-copilot --source . --region us-central1
