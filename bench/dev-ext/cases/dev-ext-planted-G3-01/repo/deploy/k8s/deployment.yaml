# support-copilot — production manifests (namespace agents).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-copilot
  namespace: agents
  labels:
    app: support-copilot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: support-copilot
  template:
    metadata:
      labels:
        app: support-copilot
    spec:
      serviceAccountName: support-copilot
      containers:
      - name: agent
        image: ghcr.io/tyrell/support-copilot:2.12.2
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        resources:
          limits:
            memory: 1Gi
