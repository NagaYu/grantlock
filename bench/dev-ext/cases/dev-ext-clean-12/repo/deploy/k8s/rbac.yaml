# repo-gardener — production manifests (namespace agents).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: repo-gardener-reader
  namespace: agents
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: repo-gardener-reader
  namespace: agents
subjects:
- kind: ServiceAccount
  name: repo-gardener
  namespace: agents
roleRef:
  kind: Role
  name: repo-gardener-reader
  apiGroup: rbac.authorization.k8s.io
