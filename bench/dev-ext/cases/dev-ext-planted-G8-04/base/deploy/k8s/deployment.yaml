# data-analyst-agent — production manifests (namespace agents-prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-analyst-agent
  namespace: agents-prod
  labels:
    app: data-analyst-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-analyst-agent
  template:
    metadata:
      labels:
        app: data-analyst-agent
    spec:
      serviceAccountName: data-analyst-agent
      containers:
      - name: agent
        image: ghcr.io/initech/data-analyst-agent:3.11.4
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        resources:
          limits:
            memory: 1Gi
