# qa-pilot の本番マニフェスト（namespace ai-prod）。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-keys
  namespace: ai-prod
spec:
  secretStoreRef:
    name: cluster-store
    kind: ClusterSecretStore
  target:
    name: llm-keys
  data:
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: qa-pilot/anthropic
