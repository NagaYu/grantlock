# Local stack for release-helper: agent API, worker, Postgres, Redis.
# Secrets come from the environment or Docker secrets; never hard-code them.
services:
  agent:
    image: ghcr.io/tyrell/release-helper:1.13.7
    ports:
    - 8080:8080
    depends_on:
    - db
    - redis
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOG_LEVEL: info
      DATABASE_URL: postgres://agent:${POSTGRES_PASSWORD}@db:5432/agent
      REDIS_HOST: redis
  worker:
    image: ghcr.io/tyrell/release-helper:1.13.7
    command:
    - python
    - -m
    - release_helper.worker
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      QUEUE_URL: redis://redis:6379/0
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
    - pg_password
    volumes:
    - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
secrets:
  pg_password:
    file: ./secrets/pg_password.txt
volumes:
  pgdata: {}
