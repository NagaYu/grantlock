# research-scout — production manifests (namespace assistant).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-scout
  namespace: assistant
  labels:
    app: research-scout
spec:
  replicas: 3
  selector:
    matchLabels:
      app: research-scout
  template:
    metadata:
      labels:
        app: research-scout
    spec:
      serviceAccountName: research-scout
      containers:
      - name: agent
        image: ghcr.io/acme/research-scout:3.15.9
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        resources:
          limits:
            memory: 1Gi
