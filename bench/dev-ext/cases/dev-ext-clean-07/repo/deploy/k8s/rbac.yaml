# research-scout — production manifests (namespace assistant).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: research-scout-reader
  namespace: assistant
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - llm-keys
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: research-scout-reader
  namespace: assistant
subjects:
- kind: ServiceAccount
  name: research-scout
  namespace: assistant
roleRef:
  kind: Role
  name: research-scout-reader
  apiGroup: rbac.authorization.k8s.io
