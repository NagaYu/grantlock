# qa-pilot — production manifests (namespace ai-prod).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qa-pilot-reader
  namespace: ai-prod
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qa-pilot-reader
  namespace: ai-prod
subjects:
- kind: ServiceAccount
  name: qa-pilot
  namespace: ai-prod
roleRef:
  kind: Role
  name: qa-pilot-reader
  apiGroup: rbac.authorization.k8s.io
