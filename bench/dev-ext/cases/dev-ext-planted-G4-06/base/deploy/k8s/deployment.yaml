# release-helper — production manifests (namespace agents-prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-helper
  namespace: agents-prod
  labels:
    app: release-helper
spec:
  replicas: 3
  selector:
    matchLabels:
      app: release-helper
  template:
    metadata:
      labels:
        app: release-helper
    spec:
      serviceAccountName: release-helper
      containers:
      - name: agent
        image: ghcr.io/globex/release-helper:2.19.8
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        resources:
          limits:
            memory: 1Gi
