# support-copilot — production manifests (namespace ai-prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-copilot
  namespace: ai-prod
  labels:
    app: support-copilot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: support-copilot
  template:
    metadata:
      labels:
        app: support-copilot
    spec:
      serviceAccountName: support-copilot
      containers:
      - name: agent
        image: ghcr.io/initech/support-copilot:1.17.5
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: model
        resources:
          limits:
            memory: 1Gi
