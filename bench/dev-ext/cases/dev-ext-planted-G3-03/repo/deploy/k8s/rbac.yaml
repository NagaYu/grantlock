# support-copilot — production manifests (namespace agents).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: support-copilot-reader
  namespace: agents
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: support-copilot-reader
  namespace: agents
subjects:
- kind: ServiceAccount
  name: support-copilot
  namespace: agents
roleRef:
  kind: Role
  name: support-copilot-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: support-copilot-secret-reader
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: support-copilot-secret-reader
subjects:
- kind: ServiceAccount
  name: support-copilot
  namespace: agents
roleRef:
  kind: ClusterRole
  name: support-copilot-secret-reader
  apiGroup: rbac.authorization.k8s.io
