# sales-ops-agent — production manifests (namespace assistant).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-keys
  namespace: assistant
spec:
  secretStoreRef:
    name: cluster-store
    kind: ClusterSecretStore
  target:
    name: llm-keys
  data:
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: sales-ops-agent/anthropic
