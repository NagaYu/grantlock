# repo-gardener のローカル環境: エージェント API、ワーカー、Postgres、Redis。
# 秘密は環境変数か Docker secrets から渡す。直書き禁止。
services:
  agent:
    image: ghcr.io/soylent/repo-gardener:2.14.5
    ports:
    - 8080:8080
    depends_on:
    - db
    - redis
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOG_LEVEL: info
      DATABASE_URL: postgres://agent:${POSTGRES_PASSWORD}@db:5432/agent
      REDIS_HOST: redis
      SENTRY_DSN: ${SENTRY_DSN:-}
  worker:
    image: ghcr.io/soylent/repo-gardener:2.14.5
    command:
    - python
    - -m
    - repo_gardener.worker
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      QUEUE_URL: redis://redis:6379/0
      SLACK_SIGNING_SECRET_FILE: /run/secrets/slack_signing
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
    - pg_password
    volumes:
    - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
secrets:
  pg_password:
    file: ./secrets/pg_password.txt
volumes:
  pgdata: {}
