# docs-assistant — production manifests (namespace assistant).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-assistant
  namespace: assistant
  labels:
    app: docs-assistant
spec:
  replicas: 3
  selector:
    matchLabels:
      app: docs-assistant
  template:
    metadata:
      labels:
        app: docs-assistant
    spec:
      serviceAccountName: docs-assistant
      containers:
      - name: agent
        image: ghcr.io/initech/docs-assistant:2.3.7
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        resources:
          limits:
            memory: 1Gi
