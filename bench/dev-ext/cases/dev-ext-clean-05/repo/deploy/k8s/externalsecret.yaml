# triage-agent の本番マニフェスト（namespace agents）。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-keys
  namespace: agents
spec:
  secretStoreRef:
    name: cluster-store
    kind: ClusterSecretStore
  target:
    name: llm-keys
  data:
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: triage-agent/anthropic
