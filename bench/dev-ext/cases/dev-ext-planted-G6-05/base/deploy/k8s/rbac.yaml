# billing-concierge の本番マニフェスト（namespace agents）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: billing-concierge-reader
  namespace: agents
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - llm-keys
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: billing-concierge-reader
  namespace: agents
subjects:
- kind: ServiceAccount
  name: billing-concierge
  namespace: agents
roleRef:
  kind: Role
  name: billing-concierge-reader
  apiGroup: rbac.authorization.k8s.io
