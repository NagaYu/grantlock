# support-copilot の本番マニフェスト（namespace assistant）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: support-copilot-reader
  namespace: assistant
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: support-copilot-reader
  namespace: assistant
subjects:
- kind: ServiceAccount
  name: support-copilot
  namespace: assistant
roleRef:
  kind: Role
  name: support-copilot-reader
  apiGroup: rbac.authorization.k8s.io
