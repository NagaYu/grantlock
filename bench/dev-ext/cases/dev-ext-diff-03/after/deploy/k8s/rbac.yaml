# docs-assistant — production manifests (namespace agents-prod).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: docs-assistant-reader
  namespace: agents-prod
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: docs-assistant-reader
  namespace: agents-prod
subjects:
- kind: ServiceAccount
  name: docs-assistant
  namespace: agents-prod
roleRef:
  kind: Role
  name: docs-assistant-reader
  apiGroup: rbac.authorization.k8s.io
