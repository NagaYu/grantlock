# docs-assistant — production manifests (namespace agents-prod).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-keys
  namespace: agents-prod
spec:
  secretStoreRef:
    name: cluster-store
    kind: ClusterSecretStore
  target:
    name: llm-keys
  data:
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: docs-assistant/anthropic
