# docs-assistant — production manifests (namespace agents-prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-assistant
  namespace: agents-prod
  labels:
    app: docs-assistant
spec:
  replicas: 3
  selector:
    matchLabels:
      app: docs-assistant
  template:
    metadata:
      labels:
        app: docs-assistant
    spec:
      serviceAccountName: docs-assistant
      containers:
      - name: agent
        image: ghcr.io/globex/docs-assistant:4.14.2
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: model
        resources:
          limits:
            memory: 1Gi
