# research-scout — production manifests (namespace agents-prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-scout
  namespace: agents-prod
  labels:
    app: research-scout
spec:
  replicas: 3
  selector:
    matchLabels:
      app: research-scout
  template:
    metadata:
      labels:
        app: research-scout
    spec:
      serviceAccountName: research-scout
      containers:
      - name: agent
        image: ghcr.io/soylent/research-scout:2.13.5
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: model
        resources:
          limits:
            memory: 1Gi
