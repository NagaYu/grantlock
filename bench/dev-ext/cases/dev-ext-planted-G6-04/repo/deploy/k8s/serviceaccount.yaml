# research-scout — production manifests (namespace agents-prod).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-scout
  namespace: agents-prod
  annotations:
    iam.gke.io/gcp-service-account: research-scout@soylent-research-scout.iam.gserviceaccount.com
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: research-scout-token
  namespace: agents-prod
  annotations:
    kubernetes.io/service-account.name: research-scout
