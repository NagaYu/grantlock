# data-analyst-agent — production manifests (namespace assistant).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-analyst-agent
  namespace: assistant
  labels:
    app: data-analyst-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-analyst-agent
  template:
    metadata:
      labels:
        app: data-analyst-agent
    spec:
      serviceAccountName: data-analyst-agent
      containers:
      - name: agent
        image: ghcr.io/wayne-ent/data-analyst-agent:4.20.2
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          value: xoxb-81912430486-3165867982804-FAKEYG7SlDeIgMLRJ5vNgczj
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: model
        resources:
          limits:
            memory: 1Gi
