# repo-gardener — production manifests (namespace ai-prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-gardener
  namespace: ai-prod
  labels:
    app: repo-gardener
spec:
  replicas: 3
  selector:
    matchLabels:
      app: repo-gardener
  template:
    metadata:
      labels:
        app: repo-gardener
    spec:
      serviceAccountName: repo-gardener
      containers:
      - name: agent
        image: ghcr.io/umbrella/repo-gardener:1.3.2
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        resources:
          limits:
            memory: 1Gi
