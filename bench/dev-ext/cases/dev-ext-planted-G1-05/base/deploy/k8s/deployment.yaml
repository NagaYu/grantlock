# incident-bot の本番マニフェスト（namespace agents）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-bot
  namespace: agents
  labels:
    app: incident-bot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: incident-bot
  template:
    metadata:
      labels:
        app: incident-bot
    spec:
      serviceAccountName: incident-bot
      containers:
      - name: agent
        image: ghcr.io/soylent/incident-bot:1.1.4
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: info
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-keys
              key: ANTHROPIC_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-bot
              key: token
        resources:
          limits:
            memory: 1Gi
