# legacy pipeline: 静的キーを使っている
on: [push]

env:
  OPENAI_API_KEY: sk-FAKEworkflowLeak00000000000000

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEPLOY_SA }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: notify
        if: secrets.SLACK_WEBHOOK != ''
        run: |
          curl -X POST -H "Authorization: Bearer xoxb-FAKE-000000000000-leak" https://slack.com/api/chat.postMessage

  admin:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: echo hi

  reuse:
    uses: ./.github/workflows/shared.yml
    secrets: inherit
